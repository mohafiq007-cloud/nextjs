name: Update V2 Neon SDK dependency lock
on:
  push:
    branches: [mariz-hq-v2-foundation]
    paths:
      - package.json
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mariz-hq-v2-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated package lock
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "mariz-v2-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(v2): lock Neon SDK dependencies"
          git push origin HEAD:mariz-hq-v2-foundation

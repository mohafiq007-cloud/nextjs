name: MARIZ HQ V2 checks
on:
  push:
    branches: [mariz-hq-v2-foundation]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve pinned Neon SDK lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/mariz-hq-v2-foundation'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build(lock): resolve Neon SDK dependencies"
            git push origin HEAD:mariz-hq-v2-foundation
          fi
      - run: npm ci
      - run: node --test tests/*.test.mjs
      - run: npm run typecheck
      - run: npm run build
